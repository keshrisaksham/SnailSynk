<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnailSynk | Shared Text Buffer</title>
    <link rel="icon" href="{{ url_for('static', filename='icon/favicon.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/text-preview.css') }}">
    <script>
        (function () {
            // Same theme and accent colour as the main page
            try {
                if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* storage blocked */ }
        })();
    </script>
    <script src="{{ url_for('static', filename='js/accent-boot.js') }}" data-mode="follow"></script>
</head>

<body class="text-preview-page">
    <header class="tp-bar">
        <div class="tp-title">
            <img src="{{ url_for('static', filename='icon/favicon.png') }}" alt="" width="24" height="24">
            <strong>Text Preview</strong>
            <span id="tpSource" class="tp-source"></span>
        </div>
        <div class="tp-actions">
            <div class="tp-toggle" role="group" aria-label="View mode">
                <button type="button" id="tpRendered" class="active">Rendered</button>
                <button type="button" id="tpRaw">Raw</button>
            </div>
            <button type="button" id="tpCopy" class="btn btn-secondary">Copy text</button>
            <a id="tpBack" class="btn btn-secondary" href="{{ url_for('main.index') }}"
                title="Go back to the main page with the shared text buffer">Back to Shared Buffer</a>
        </div>
    </header>
    <main class="tp-main">
        <article id="tpRenderedView" class="markdown-preview tp-content"></article>
        <pre id="tpRawView" class="tp-raw" hidden></pre>
    </main>

    <script src="{{ url_for('static', filename='js/purify.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/markdown-preview.js') }}"></script>
    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/text-preview.js') }}"></script>
</body>

</html>
